# Infraestrutura Render — Daniela Beauty.
# NÃO contém segredos: todas as chaves marcadas `sync: false` são
# preenchidas no painel do Render (Environment).
#
# Persistência: enquanto a base de dados for SQLite, é OBRIGATÓRIO um disco
# persistente (o filesystem do Render é efémero — sem disco, todas as
# marcações desaparecem a cada deploy). Ao migrar para Postgres, trocar o
# disco por `DATABASE_URL` (ver MIGRATION.md) e subir os workers no Procfile.

services:
  - type: web
    name: daniela-beauty
    runtime: python
    plan: starter                     # o disco persistente exige plano pago
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -c "import db; db.migrar(verbose=True)"
    startCommand: gunicorn bot:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /versao
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Versão do Python: fonte primária é o ficheiro .python-version na raiz
      # (3.12.7). Este PYTHON_VERSION é redundante de propósito — mesmo valor —
      # para o build ficar preso a 3.12.7 mesmo que o buildpack ignore um dos
      # dois. NÃO usar 3.13/3.14 (psycopg-binary e outras wheels ainda não
      # cobrem essas versões — foi o que rebentou o build anterior).
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SESSOES_DB
        value: /var/data/sessoes.db
      - key: MEDIA_DIR
        value: /var/data/media_pedidos
      - key: TZ
        value: Europe/Zurich
      - key: BUSINESS_NAME
        value: Daniela Beauty
      - key: BUSINESS_ADDRESS
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: PROVIDER_WHATSAPP
        sync: false
      - key: APP_SECRET
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # DATABASE_URL: deixar por definir enquanto usar SQLite.

  # EXECUTOR dos jobs adiados (post_service — P0; reminder_24h — P1; ver
  # notifications/jobs.py). Sem isto, `/api/automacoes/correr` só corre
  # quando alguém abre o painel autenticado e clica "correr automações" —
  # o reminder 24h nunca dispara sozinho. Corre a cada 5 min: run_at é
  # sempre "há X min ou mais", nunca "no minuto exato", por isso um atraso
  # de alguns minutos no pior caso é aceitável (nunca envia cedo demais).
  - type: cron
    name: daniela-beauty-automacoes
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install requests
    startCommand: >
      python -c "
      import os, requests;
      r = requests.post(os.environ['PUBLIC_BASE_URL'] + '/api/automacoes/correr',
                        auth=(os.environ['DASHBOARD_USER'], os.environ['DASHBOARD_PASSWORD']), timeout=30);
      r.raise_for_status();
      print(r.text)"
    envVars:
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
