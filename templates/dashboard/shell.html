<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ business_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard/app.css') }}?v={{ asset_v }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2317171a'/><text x='16' y='22' font-size='16' font-family='sans-serif' fill='white' text-anchor='middle'>D</text></svg>">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-today"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
  <g id="i-calendar"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></g>
  <g id="i-users"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-4.6 5.5-4.6s5.5 1.6 5.5 4.6"/><path d="M16 5.5a3 3 0 0 1 0 5.6M20.5 19c0-2.4-1.4-3.9-3.5-4.4"/></g>
  <g id="i-sparkles"><path d="M12 3l1.8 4.5L18 9l-4.2 1.5L12 15l-1.8-4.5L6 9l4.2-1.5z"/><path d="M18 14l.9 2.2L21 17l-2.1.8L18 20l-.9-2.2L15 17l2.1-.8z"/></g>
  <g id="i-clock"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g>
  <g id="i-file"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h6M9 16.5h6"/></g>
  <g id="i-settings"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M4.2 7.5l2.1 1.3M17.7 15.2l2.1 1.3M20 7.5l-2.1 1.3M6.3 15.2l-2.1 1.3"/></g>
  <g id="i-menu"><path d="M4 7h16M4 12h16M4 17h16"/></g>
  <g id="i-x"><path d="M6 6l12 12M18 6L6 18"/></g>
  <g id="i-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4 12H1.5M22.5 12H20M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"/></g>
  <g id="i-moon"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></g>
  <g id="i-check"><path d="M5 12.5l4.5 4.5L19 7"/></g>
  <g id="i-play"><path d="M8 5.5v13l11-6.5z"/></g>
  <g id="i-arrow"><path d="M5 12h14M13 6l6 6-6 6"/></g>
  <g id="i-user-check"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-4.6 5.5-4.6 1.2 0 2.3.25 3.2.7"/><path d="M15 15.5l1.8 1.8L21 13"/></g>
  <g id="i-alert"><path d="M12 4l9 15H3z"/><path d="M12 10v4M12 16.5v.5"/></g>
  <g id="i-receipt"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 12h6"/></g>
  <g id="i-send"><path d="M21 3L3 10.5l7 2.5m11-10l-4.5 17L10 13m11-10L10 13"/></g>
</defs></svg>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">{{ business_name[:1] | upper }}</span>
      <span class="brand-name">{{ business_name }}</span>
    </div>
    <nav class="nav-group" id="nav">
      <a class="nav-item" href="#/hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-today"/></svg>Hoje<span class="nav-badge" id="nav-att" hidden>0</span></a>
      <a class="nav-item" href="#/agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-calendar"/></svg>Agenda</a>
      <a class="nav-item" href="#/clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-users"/></svg>Clientes</a>
      <a class="nav-item" href="#/servicos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-sparkles"/></svg>Serviços</a>
      <a class="nav-item" href="#/horarios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-clock"/></svg>Horários</a>
      <a class="nav-item" href="#/faturas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-file"/></svg>Faturas</a>
    </nav>
    <span class="nav-spacer"></span>
    <nav class="nav-group">
      <a class="nav-item" href="#/definicoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-settings"/></svg>Definições</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><use href="#i-menu"/></svg></button>
      <div>
        <h1 id="page-title">Hoje</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="topbar-actions">
        <div class="novo-wrap" id="novo-wrap">
          <button class="btn btn--primary" id="novo-btn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Novo</button>
          <div class="novo-menu" id="novo-menu" role="menu" hidden></div>
        </div>
        <button class="icon-btn" id="theme-btn" aria-label="Ativar modo escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use id="theme-btn-icon" href="#i-sun"/></svg></button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast-stack" id="toasts"></div>

<script src="{{ url_for('static', filename='dashboard/app.js') }}?v={{ asset_v }}"></script>
</body>
</html>
